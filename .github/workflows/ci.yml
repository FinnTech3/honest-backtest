name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Show the cost waterfall
        run: honestbt waterfall
      - name: Show what look-ahead does
        run: honestbt lookahead
      - name: Figures regenerate identically
        # The charts are computed from the committed prices, so a drift
        # between a published figure and the backtest behind it fails here.
        run: |
          python3 scripts/make_figures.py
          git diff --exit-code -- docs/figures/ \
            || (echo "committed figures do not match regenerated output" && exit 1)
